<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DesiHub Admin Panel</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f6f9;color:#222}
.admin-layout{display:flex;min-height:100vh}
.sidebar{width:230px;background:#111827;color:#fff;position:fixed;left:0;top:0;bottom:0;padding:20px 12px}
.logo{font-size:23px;font-weight:bold;margin-bottom:25px}
.nav{display:block;color:#fff;text-decoration:none;padding:13px 15px;margin:6px 0;border-radius:8px}
.nav:hover,.nav.active{background:#374151}
.main{margin-left:230px;width:calc(100% - 230px);padding:25px}
h1{margin-bottom:5px}
.subtitle{color:#666;margin-bottom:25px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:25px}
.card,.panel{background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 10px #ddd}
.card .icon{font-size:30px}
.card h3{margin:10px 0 5px;color:#666}
.card strong{font-size:30px}
.panel{margin-bottom:25px}
.panel h2{margin-bottom:20px}
.form{display:grid;gap:14px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px}
textarea{min-height:90px}
.btn{background:#2563eb;color:#fff;padding:12px 18px;border-radius:8px;font-weight:bold}
.video-item{display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd;border-radius:10px;padding:15px;margin:10px 0}
.delete{background:#dc2626;color:#fff;padding:8px 12px;border-radius:7px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}
th{background:#f3f4f6}
.empty{color:#777;padding:15px 0}

@media(max-width:700px){
.sidebar{width:70px;padding:12px 5px}
.logo{font-size:0;text-align:center}
.logo:first-letter{font-size:25px}
.nav{font-size:0;text-align:center;padding:14px 5px}
.nav:first-letter{font-size:20px}
.main{margin-left:70px;width:calc(100% - 70px);padding:15px}
.stats{grid-template-columns:1fr}
.video-item{display:block}
}
</style>
</head>

<body>

<div class="admin-layout">

<aside class="sidebar">
<div class="logo">🎬 DesiHub</div>
<a class="nav active" href="#dashboard">📊 Dashboard</a>
<a class="nav" href="#videos">🎥 Videos</a>
<a class="nav" href="#users">👥 Users</a>
<a class="nav" href="index.html">🌐 User Panel</a>
</aside>

<main class="main">

<section id="dashboard">
<h1>Admin Panel</h1>
<p class="subtitle">DesiHub Management</p>

<div class="stats">

<div class="card">
<div class="icon">🎥</div>
<h3>Total Videos</h3>
<strong id="totalVideos">0</strong>
</div>

<div class="card">
<div class="icon">👥</div>
<h3>Total Users</h3>
<strong id="totalUsers">0</strong>
</div>

<div class="card">
<div class="icon">⭐</div>
<h3>Active Premium</h3>
<strong id="activePremium">0</strong>
</div>

</div>
</section>

<section id="videos" class="panel">
<h2>🎥 Add New Video</h2>

<form id="videoForm" class="form">

<input id="videoTitle" type="text" placeholder="Video Title" required>

<select id="videoCategory" required>
<option value="">Select Category</option>
<option>Witchy Moye</option>
<option>Drama</option>
<option>Comedy</option>
<option>Action</option>
</select>

<input id="videoUrl" type="url" placeholder="Video URL" required>

<input id="thumbnailUrl" type="url" placeholder="Thumbnail URL">

<input id="videoDuration" type="text" placeholder="Duration e.g. 02:30">

<textarea id="videoDescription" placeholder="Description"></textarea>

<button class="btn" type="submit">➕ Add Video</button>

</form>
</section>

<section class="panel">
<h2>📋 Video List</h2>
<div id="videoList">
<div class="empty">No videos added yet.</div>
</div>
</section>

<section id="users" class="panel">
<h2>👥 Registered Users</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Premium</th>
</tr>
</thead>

<tbody id="usersTableBody">
<tr>
<td colspan="3" class="empty">No users found</td>
</tr>
</tbody>
</table>

</section>

</main>
</div>

<script src="js/admin.js?v=3"></script>

</body>
</html>
