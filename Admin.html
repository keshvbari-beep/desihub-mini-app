<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DesiHub - Admin Panel</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="admin-layout">

    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-logo">🎬 DesiHub</div>

      <button class="admin-nav active" data-section="dashboard">
        📊 Dashboard
      </button>

      <button class="admin-nav" data-section="videos">
        🎥 Videos
      </button>

      <button class="admin-nav" data-section="users">
        👥 Users
      </button>

      <a href="index.html" class="admin-nav">
        🌐 User Panel
      </a>
    </aside>

    <!-- Main -->
    <main class="admin-main">

      <header class="admin-header">
        <div>
          <h1>Admin Panel</h1>
          <p>DesiHub Management</p>
        </div>
      </header>

      <!-- Dashboard -->
      <section id="dashboardSection" class="admin-section">

        <h2>Dashboard</h2>

        <div class="stats-grid">

          <div class="stat-card">
            <div class="stat-icon">🎥</div>
            <div>
              <span>Total Videos</span>
              <strong id="totalVideos">0</strong>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon">👥</div>
            <div>
              <span>Total Users</span>
              <strong id="totalUsers">0</strong>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon">⭐</div>
            <div>
              <span>Active Premium</span>
              <strong id="activePremium">0</strong>
            </div>
          </div>

        </div>

        <div class="admin-card">
          <h3>Quick Actions</h3>

          <button class="primary-btn" onclick="showSection('videos')">
            ➕ Add New Video
          </button>

          <button class="secondary-btn" onclick="showSection('users')">
            👥 View Users
          </button>
        </div>

      </section>

      <!-- Videos -->
      <section id="videosSection" class="admin-section hidden">

        <h2>Manage Videos</h2>

        <div class="admin-card">

          <h3>Add New Video</h3>

          <form id="videoForm">

            <div class="form-group">
              <label>Video Title</label>
              <input
                type="text"
                id="videoTitle"
                placeholder="Video title"
                required
              >
            </div>

            <div class="form-group">
              <label>Category</label>

              <select id="videoCategory" required>
                <option value="">Select Category</option>
                <option value="witchymoye">Witchy Moye</option>
                <option value="drama">Drama</option>
                <option value="comedy">Comedy</option>
                <option value="action">Action</option>
              </select>
            </div>

            <div class="form-group">
              <label>Video URL</label>

              <input
                type="url"
                id="videoUrl"
                placeholder="https://example.com/video.mp4"
                required
              >
            </div>

            <div class="form-group">
              <label>Thumbnail URL</label>

              <input
                type="url"
                id="thumbnailUrl"
                placeholder="https://example.com/image.jpg"
                required
              >
            </div>

            <div class="form-group">
              <label>Duration</label>

              <input
                type="text"
                id="videoDuration"
                placeholder="10:30"
              >
            </div>

            <div class="form-group">
              <label>Description</label>

              <textarea
                id="videoDescription"
                rows="4"
                placeholder="Video description"
              ></textarea>
            </div>

            <button type="submit" class="primary-btn">
              ➕ Add Video
            </button>

          </form>

        </div>

        <div class="admin-card">

          <h3>Video List</h3>

          <div id="videoList">
            Loading videos...
          </div>

        </div>

      </section>

      <!-- Users -->
      <section id="usersSection" class="admin-section hidden">

        <h2>Manage Users</h2>

        <div class="admin-card">

          <h3>Registered Users</h3>

          <div class="table-wrapper">

            <table class="admin-table">

              <thead>
                <tr>
                  <th>Email</th>
                  <th>Subscription</th>
                  <th>Expiry</th>
                </tr>
              </thead>

              <tbody id="usersTableBody">
              </tbody>

            </table>

          </div>

        </div>

      </section>

    </main>

  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="js/telegram.js"></script>
  <script src="js/admin.js"></script>

</body>
  </html>
