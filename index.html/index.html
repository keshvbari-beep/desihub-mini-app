<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DesiHub</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#0b0b0f;
    color:white;
}

button{
    border:0;
    cursor:pointer;
}

.auth-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-box{
    width:100%;
    max-width:400px;
    background:#17171d;
    padding:28px;
    border-radius:18px;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border-radius:10px;
    border:1px solid #333;
    background:#0e0e12;
    color:white;
    font-size:16px;
}

.btn{
    width:100%;
    padding:14px;
    border-radius:10px;
    background:#ff315c;
    color:white;
    font-size:16px;
    font-weight:bold;
    margin-bottom:12px;
}

.switch{
    text-align:center;
    color:#aaa;
    margin-top:10px;
}

.switch button{
    background:none;
    color:#ff315c;
    font-weight:bold;
    font-size:15px;
}

.main-app{
    display:none;
    min-height:100vh;
}

header{
    padding:16px;
    background:#15151b;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    font-size:24px;
    font-weight:bold;
}

.logout{
    background:#292930;
    color:white;
    padding:9px 14px;
    border-radius:8px;
}

.container{
    padding:18px;
}

.hero{
    background:linear-gradient(135deg,#40152a,#171725);
    padding:25px;
    border-radius:18px;
    margin-bottom:20px;
}

.hero h1{
    margin-bottom:8px;
}

.hero p{
    color:#ccc;
}

.section-title{
    margin:20px 0 12px;
}

.video-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:15px;
}

.video-card{
    background:#18181e;
    padding:12px;
    border-radius:14px;
    cursor:pointer;
}

.video-card h3{
    margin-top:10px;
    font-size:16px;
}

.video-card p{
    color:#999;
    margin-top:6px;
    font-size:13px;
}

.player-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:1000;
}

.player-box{
    width:100%;
    max-width:700px;
    background:#17171d;
    padding:15px;
    border-radius:15px;
}

.player-box video{
    width:100%;
    border-radius:10px;
    background:#000;
}

.close{
    background:#ff315c;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    margin-top:12px;
}

.form-title{
    font-size:22px;
    margin-bottom:18px;
}
</style>
</head>

<body>

<!-- LOGIN / SIGNUP -->
<div id="authScreen" class="auth-screen">

    <div class="auth-box">

        <div class="logo">🎬 DesiHub</div>
        <div class="subtitle">Premium Videos</div>

        <!-- LOGIN -->
        <div id="loginBox">

            <div class="form-title">Login</div>

            <form id="loginForm">

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                    required
                >

                <button
                    id="loginButton"
                    class="btn"
                    type="submit">
                    Login
                </button>

            </form>

            <div class="switch">
                Account नहीं है?
                <button
                    type="button"
                    onclick="showSignup()">
                    Create Account
                </button>
            </div>

        </div>


        <!-- SIGNUP -->
        <div id="signupBox" style="display:none;">

            <div class="form-title">Create Account</div>

            <form id="signupForm">

                <input
                    id="signupName"
                    type="text"
                    placeholder="Name"
                    required
                >

                <input
                    id="signupEmail"
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    id="signupPassword"
                    type="password"
                    placeholder="Password"
                    required
                >

                <button
                    id="signupButton"
                    class="btn"
                    type="submit">
                    Create Account
                </button>

            </form>

            <div class="switch">
                पहले से Account है?
                <button
                    type="button"
                    onclick="showLogin()">
                    Login
                </button>
            </div>

        </div>

    </div>
</div>


<!-- MAIN APP -->
<div id="mainApp" class="main-app">

    <header>

        <div class="brand">🎬 DesiHub</div>

        <button
            id="logoutBtn"
            class="logout"
            type="button">
            Logout
        </button>

    </header>


    <div class="container">

        <div class="hero">

            <h1>Welcome to DesiHub 👋</h1>

            <p>
                Premium videos एक ही जगह देखें।
            </p>

        </div>


        <h2 class="section-title">
            🎥 Videos
        </h2>

        <div
            id="videoGrid"
            class="video-grid">

            <div style="padding:20px;text-align:center;">
                Videos loading...
            </div>

        </div>

    </div>

</div>


<!-- VIDEO PLAYER -->
<div
    id="playerModal"
    class="player-modal">

    <div class="player-box">

        <h3
            id="playerTitle"
            style="margin-bottom:12px;">
        </h3>

        <video
            id="videoPlayer"
            controls
            playsinline>
        </video>

        <button
            class="close"
            type="button"
            onclick="closePlayer()">
            Close
        </button>

    </div>

</div>


<script>

function showSignup(){

    document.getElementById("loginBox").style.display="none";

    document.getElementById("signupBox").style.display="block";

}


function showLogin(){

    document.getElementById("signupBox").style.display="none";

    document.getElementById("loginBox").style.display="block";

}

</script>


<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- User JavaScript -->
<script src="./js/user.js"></script>

</body>
</html>
